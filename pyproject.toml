[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetsentry"
version = "1.0.0"
description = "Local-first CSV/TSV inspection and safe sanitization before sharing or import."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SheetSentry contributors"}]
keywords = ["csv", "tsv", "data-quality", "formula-injection", "security", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pangxueyuan2-creator/sheetsentry"
Repository = "https://github.com/pangxueyuan2-creator/sheetsentry"
Issues = "https://github.com/pangxueyuan2-creator/sheetsentry/issues"

[project.scripts]
sheetsentry = "sheetsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sheetsentry"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
